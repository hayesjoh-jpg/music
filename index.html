<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111826" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Music Panel</title>

  <style>
    :root{
      --bg0:#050812;
      --bg1:#0b1230;
      --card: rgba(255,255,255,.08);
      --card2: rgba(255,255,255,.05);
      --stroke: rgba(255,255,255,.14);
      --text:#EAF0FF;
      --muted:#AAB6D2;
      --accent:#1DB954;
      --shadow: 0 18px 55px rgba(0,0,0,.55);
      --r: 22px;
      --glowA: rgba(29,185,84,.28);
      --glowB: rgba(80,145,255,.22);
      --tile-size:170px;
      --station-tile-size:190px;
      --spotify-slot:170px;
    }

    body.theme-light{
      --bg0:#eef2ff;
      --bg1:#f7f9ff;
      --card: rgba(255,255,255,.75);
      --card2: rgba(255,255,255,.55);
      --stroke: rgba(0,0,0,.10);
      --text:#0e1422;
      --muted:#4b5870;
      --accent:#1DB954;
      --shadow: 0 16px 45px rgba(0,0,0,.10);
      --glowA: rgba(29,185,84,.20);
      --glowB: rgba(80,145,255,.18);
    }

    body.theme-radio{
      --bg0:#090b13;
      --bg1:#1b1034;
      --card: rgba(255,255,255,.07);
      --card2: rgba(255,255,255,.04);
      --stroke: rgba(255,255,255,.13);
      --text:#fff2f2;
      --muted:#d2b7bf;
      --accent:#ff3b5c;
      --shadow: 0 18px 55px rgba(0,0,0,.55);
      --glowA: rgba(255,59,92,.24);
      --glowB: rgba(255,196,59,.14);
    }

    *{ box-sizing:border-box; }

    html, body{
      height:100%;
      margin:0;
    }

    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 800px at 18% -10%, var(--glowB) 0%, transparent 55%),
        radial-gradient(900px 650px at 92% 8%, var(--glowA) 0%, transparent 52%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      overflow-x:hidden;
    }

    .app{
      max-width:1100px;
      margin:0 auto;
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:14px;
      position:relative;
    }

    .grid{
      display:grid;
      grid-template-columns: minmax(0, 1fr) var(--spotify-slot);
      gap:14px;
      align-items:start;
    }

    @media (max-width: 900px){
      .grid{
        grid-template-columns: 1fr;
      }
    }

    .card{
      border-radius: var(--r);
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, var(--card), var(--card2));
      box-shadow: var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(14px);
    }

    .card .hd{
      padding:14px 14px 0;
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:10px;
    }

    .card .hd h2{
      margin:0;
      font-size:16px;
      letter-spacing:.2px;
    }

    .card .hd span{
      color:var(--muted);
      font-size:12px;
      white-space:nowrap;
    }

    .card .bd{
      padding:14px;
    }

    .btn-primary{
      width:100%;
      border:0;
      border-radius:18px;
      padding:18px 16px;
      font-size:22px;
      font-weight:900;
      color:#06110a;
      background: var(--accent);
      box-shadow: 0 16px 36px rgba(0,0,0,.25);
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-primary:active{
      transform: translateY(1px);
    }

    .radio-shell{
      position:relative;
      border:1px solid rgba(255,232,191,.18);
      border-radius:28px;
      padding:14px;
      background:
        linear-gradient(135deg, rgba(90,55,26,.95), rgba(53,32,21,.96)),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.20));
      box-shadow:
        inset 0 1px 0 rgba(255,242,214,.14),
        inset 0 -16px 24px rgba(0,0,0,.20),
        0 20px 40px rgba(0,0,0,.34);
    }

    .radio-shell::before{
      content:"";
      position:absolute;
      inset:8px;
      border-radius:22px;
      border:1px solid rgba(255,230,188,.08);
      pointer-events:none;
    }

    .radio-shell::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:28px;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,.02) 0,
          rgba(255,255,255,.02) 2px,
          transparent 2px,
          transparent 28px
        );
      opacity:.25;
      pointer-events:none;
    }

    .radio-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
      position:relative;
      z-index:1;
    }

    .radio-brand{
      display:flex;
      align-items:center;
      gap:10px;
      color:#dbc6a5;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.22em;
    }

    .live-dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:#ff5b6e;
      box-shadow:0 0 12px rgba(255,91,110,.75);
    }

    .radio-face{
      display:block;
      position:relative;
      z-index:1;
    }

    .radio-panel{
      min-width:0;
      border:1px solid rgba(255,255,255,.18);
      border-radius:12px;
      padding:8px;
      background:
        linear-gradient(180deg, #3e3e3e, #171717);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 -8px 16px rgba(0,0,0,.45);
    }

    .stereo-face{
      display:grid;
      grid-template-columns:64px 1fr 56px;
      gap:8px;
      border:1px solid rgba(255,255,255,.22);
      border-radius:8px;
      padding:8px;
      background:#0a0a0a;
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.03),
        inset 0 0 22px rgba(0,0,0,.9);
    }

    .stereo-side{
      display:flex;
      flex-direction:column;
      gap:8px;
      min-width:0;
    }

    .stereo-brand-row{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:10px;
      color:#e7e7e7;
      font-size:10px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
      margin-bottom:4px;
    }

    .stereo-brand-row span:first-child{
      color:#f4f4f4;
    }

    .stereo-model{
      text-align:right;
      color:#cfcfcf;
    }

    .stereo-screen{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:12px;
      min-height:74px;
      padding:4px 0;
    }

    .eq-bank{
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:4px;
      min-height:52px;
    }

    .eq-bank span{
      width:7px;
      height:18px;
      background:#f2f2f2;
      box-shadow:0 0 8px rgba(255,255,255,.18);
      opacity:.8;
    }

    .eq-bank span:nth-child(2){ height:30px; }
    .eq-bank span:nth-child(3){ height:42px; }
    .eq-bank span:nth-child(4){ height:24px; }
    .eq-bank span:nth-child(5){ height:38px; }
    .eq-bank span:nth-child(6){ height:48px; }
    .eq-bank span:nth-child(7){ height:34px; }

    .stereo-face.is-playing .eq-bank span{
      animation:eqBounce 1s ease-in-out infinite;
    }

    .stereo-face.is-playing .eq-bank span:nth-child(2n){
      animation-delay:.15s;
    }

    .stereo-face.is-playing .eq-bank span:nth-child(3n){
      animation-delay:.28s;
    }

    @keyframes eqBounce{
      0%, 100%{ transform:scaleY(.65); }
      50%{ transform:scaleY(1.12); }
    }

    .stereo-readout{
      text-align:center;
      min-width:180px;
      color:#f7f7f7;
    }

    .stereo-frequency{
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size:54px;
      line-height:.9;
      font-weight:300;
      letter-spacing:.04em;
      color:#f7f7f7;
      text-shadow:0 0 10px rgba(255,255,255,.2);
    }

    .stereo-frequency small{
      font-size:15px;
      font-weight:800;
      letter-spacing:0;
      margin-left:4px;
    }

    .display-meta{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      margin-bottom:2px;
    }

    .freq-label{
      color:#f4f4f4;
      font-size:10px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .radio-station{
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size:16px;
      line-height:1;
      font-weight:800;
      letter-spacing:0;
      margin:8px 0 0;
      text-transform:uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      color:#f7f7f7;
    }

    .radio-status{
      margin-top:6px;
      text-align:center;
    }

    .status-pill{
      padding:2px 7px;
      border-radius:4px;
      border:1px solid rgba(255,255,255,.5);
      background:transparent;
      color:#f4f4f4;
      font-size:10px;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .status-text{
      color:#e1e1e1;
      font-size:10px;
      font-weight:700;
    }

    .stereo-buttons{
      display:grid;
      grid-template-columns:repeat(7, minmax(0, 1fr));
      gap:6px;
    }

    .stereo-btn{
      min-height:32px;
      border:1px solid rgba(255,255,255,.78);
      border-radius:5px;
      background:linear-gradient(180deg, #111, #050505);
      color:#f7f7f7;
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
    }

    .radio-caption{
      color:#d9c29b;
      font-size:12px;
      letter-spacing:.14em;
      text-transform:uppercase;
    }

    .power-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:8px;
    }

    .power-knob{
      width:100%;
      min-height:60px;
      border-radius:6px;
      border:1px solid rgba(255,255,255,.78);
      background:linear-gradient(180deg, #151515, #040404);
      color:#f8f8f8;
      font-weight:900;
      font-size:13px;
      letter-spacing:.08em;
      text-transform:uppercase;
      cursor:pointer;
      position:relative;
    }

    .power-label{
      color:#ededed;
      font-size:10px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .port-stack{
      display:flex;
      flex-direction:column;
      gap:8px;
      align-items:center;
      color:#d8d8d8;
      font-size:10px;
      text-transform:uppercase;
    }

    .usb-port{
      width:28px;
      height:52px;
      border:2px solid #bdbdbd;
      border-radius:4px;
      background:linear-gradient(90deg, #f1f1f1, #777);
      box-shadow:inset 0 0 8px rgba(0,0,0,.7);
    }

    .aux-dot{
      width:28px;
      height:28px;
      border-radius:50%;
      border:2px solid #333;
      background:radial-gradient(circle at 35% 35%, #555, #111);
    }

    @media (max-width: 980px){
      .radio-face{
        display:block;
      }
    }

    audio{
      display:none;
    }

    .stations{
      display:flex;
      gap:16px;
      overflow-x:auto;
      overflow-y:hidden;
      padding:4px 4px 12px;
      scroll-snap-type:x proximity;
      touch-action:none;
      overscroll-behavior-x:contain;
      user-select:none;
      -webkit-overflow-scrolling:touch;
    }

    .stations.dragging{
      cursor:grabbing;
      scroll-snap-type:none;
    }

    .station-scroll-controls{
      display:flex;
      gap:6px;
    }

    .station-scroll-btn{
      width:28px;
      height:28px;
      border:1px solid var(--stroke);
      border-radius:999px;
      background:rgba(255,255,255,.08);
      color:var(--text);
      font-size:16px;
      font-weight:900;
      line-height:1;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .station-scroll-btn:active{
      transform:translateY(1px);
    }

    .stations .station{
      flex:0 0 var(--station-tile-size);
      width:var(--station-tile-size);
      min-width:var(--station-tile-size);
      max-width:var(--station-tile-size);
      min-height:var(--station-tile-size);
      scroll-snap-align:start;
      touch-action:none;
    }

    .station{
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      min-height:var(--tile-size);
      aspect-ratio: 1 / 1;
      padding:0;
      margin:0;
      border:1px solid #666;
      border-radius:16px;
      background: transparent;
      cursor:pointer;
      overflow:hidden;
      -webkit-tap-highlight-color: transparent;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .station:active{
      transform: translateY(1px);
    }

    .station.active-station{
      transform: scale(1.06);
      border-color: rgba(255,255,255,.92);
      box-shadow: 0 0 0 2px rgba(255,255,255,.12), 0 14px 28px rgba(0,0,0,.24);
      z-index:1;
    }

    .station img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      border-radius:12px;
      background: rgba(255,255,255,.03);
    }

    .spotify-card{
      width:100%;
      min-width:0;
      min-height:var(--spotify-slot);
      display:flex;
      flex-direction:column;
      justify-self:stretch;
      align-self:start;
    }

    .spotify-card .bd{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .spotify-button{
      width:var(--tile-size);
      min-height:var(--tile-size);
      aspect-ratio:1 / 1;
    }

    .hint{
      color:var(--muted);
      font-size:12px;
      line-height:1.4;
      margin-top:10px;
    }

    @media (max-width: 900px){
      :root{
        --tile-size:120px;
        --station-tile-size:150px;
      }

      .app{
        padding:12px;
        gap:10px;
      }

      .grid{
        grid-template-columns:1fr;
      }

      .card .hd{
        padding:12px 12px 0;
      }

      .card .bd{
        padding:12px;
      }

      .stations{
        gap:12px;
      }
    }

    @media (max-height: 1100px) and (orientation: landscape){
      :root{
        --tile-size:150px;
        --station-tile-size:190px;
        --spotify-slot:220px;
      }

      .app{
        padding:8px 10px;
        gap:8px;
      }

      .grid{
        gap:8px;
        grid-template-columns:minmax(0, 1fr) var(--spotify-slot);
      }

      .card .hd{
        padding:8px 8px 0;
      }

      .card .hd h2{
        font-size:13px;
      }

      .card .bd{
        padding:8px;
      }

      .radio-shell{
        padding:6px;
        border-radius:14px;
      }

      .radio-shell::before{
        inset:4px;
        border-radius:10px;
      }

      .radio-top{
        margin-bottom:4px;
      }

      .radio-brand{
        font-size:9px;
        letter-spacing:.12em;
      }

      .status-pill{
        padding:2px 6px;
        font-size:8px;
      }

      .radio-panel{
        padding:6px;
        border-radius:12px;
      }

      .freq-label{
        margin-bottom:2px;
        font-size:8px;
      }

      .radio-station{
        font-size:18px;
        margin-bottom:2px;
      }

      .radio-status{
        gap:5px;
        margin-bottom:4px;
      }

      .status-text{
        font-size:9px;
      }

      .power-wrap{
        gap:2px;
      }

      .power-knob{
        width:48px;
        height:48px;
        font-size:8px;
      }

      .power-knob::before{
        top:6px;
        width:5px;
        height:10px;
      }

      .power-label{
        font-size:8px;
      }

      .stations{
        gap:8px;
        padding:4px 4px 10px;
      }

      .station{
        border-radius:12px;
      }

      .station img{
        border-radius:10px;
      }
    }
  </style>
</head>

  <body class="theme-glass">
    <div class="app">
      <div class="grid">
        <section class="card">
          <div class="hd">
            <h2>Radio</h2>
          <span></span>
        </div>
        <div class="bd">
          <div class="radio-shell">
            <div class="radio-top">
              <div class="radio-brand">
                <span class="live-dot" id="liveDot"></span>
                <span>FM Receiver</span>
              </div>
              <div class="status-pill" id="liveBadge">Standby</div>
            </div>

            <div class="radio-face">
              <div class="radio-panel">
                <div class="stereo-face" id="stereoFace">
                  <div class="stereo-side">
                    <button class="stereo-btn" type="button">MOD</button>
                    <button class="stereo-btn" type="button">BND<br>CLK</button>
                  </div>

                  <div>
                    <div class="stereo-brand-row">
                      <span>Pinang</span>
                      <span>USB/TF Touch MP3 Player</span>
                      <span class="stereo-model">PA337</span>
                    </div>

                    <div class="stereo-screen">
                      <div class="eq-bank" aria-hidden="true">
                        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                      </div>

                      <div class="stereo-readout">
                        <div class="display-meta">
                          <span class="status-pill" id="bandLabel">FM</span>
                          <span class="freq-label">MHz</span>
                        </div>
                        <div class="stereo-frequency"><span id="frequencyReadout">87.5</span><small>MHz</small></div>
                        <div class="radio-station" id="nowTitle">Radio Off</div>
                        <div class="radio-status">
                          <span class="status-text" id="nowStatus">Select a station to tune in</span>
                        </div>
                      </div>

                      <div class="eq-bank" aria-hidden="true">
                        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                      </div>
                    </div>

                    <div class="stereo-buttons" aria-hidden="true">
                      <button class="stereo-btn" type="button">&#9664;&#9664;</button>
                      <button class="stereo-btn" type="button">&#9654;&#9654;</button>
                      <button class="stereo-btn" type="button">VOL+</button>
                      <button class="stereo-btn" type="button">VOL-</button>
                      <button class="stereo-btn" type="button">1/PAU</button>
                      <button class="stereo-btn" type="button">2/INT</button>
                      <button class="stereo-btn" type="button">3/RPT</button>
                    </div>
                  </div>

                  <div class="stereo-side">
                    <div class="port-stack">
                      <span>USB</span>
                      <span class="usb-port"></span>
                      <span>AUX</span>
                      <span class="aux-dot"></span>
                    </div>
                    <div class="power-wrap">
                      <button class="power-knob" onclick="stopRadio()">Stop</button>
                      <div class="power-label">Power</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <audio id="radio" preload="none"></audio>
          </div>
        </div>
      </section>

        <section class="card spotify-card">
          <div class="hd">
            <h2>Spotify</h2>
            <span></span>
          </div>
          <div class="bd">
            <button class="station spotify-button" onclick="openSpotify()" aria-label="Open Spotify">
              <img src="spotify.svg" alt="Spotify">
            </button>
          </div>
        </section>

        <section class="card" style="grid-column: 1 / -1;">
          <div class="hd">
          <h2>Stations</h2>
          <div class="station-scroll-controls" aria-label="Station list controls">
            <button class="station-scroll-btn" type="button" onclick="scrollStations(-1)" aria-label="Scroll stations left">&lt;</button>
            <button class="station-scroll-btn" type="button" onclick="scrollStations(1)" aria-label="Scroll stations right">&gt;</button>
          </div>
        </div>
        <div class="bd">
          <div class="stations">
            <button class="station" data-station="RTE 1" data-url="https://icecast.rte.ie/radio1">
              <img src="rteradio1.png" alt="RTE Radio 1">
            </button>

            <button class="station" data-station="Sunshine 106.8" data-url="https://playerservices.streamtheworld.com/api/livestream-redirect/SUNSHINE_106_8AAC.aac">
              <img src="sunshine1068.png" alt="Sunshine 106.8">
            </button>

            <button class="station" data-station="East Coast FM" data-url="https://playerservices.streamtheworld.com/api/livestream-redirect/EAST_COAST_FM.mp3">
              <img src="eastcoastfm.png" alt="East Coast FM">
            </button>

            <button class="station" data-station="2FM" data-url="https://icecast.rte.ie/2fm">
              <img src="2fm.png" alt="RTE 2 FM">
            </button>

            <button class="station" data-station="Q102" data-url="https://wg.cdn.tibus.net/q102MP3128">
              <img src="q102.svg" alt="Dublin's Q102">
            </button>

            <button class="station" data-station="RTE Lyric FM" data-url="https://icecast2.rte.ie/lyric">
              <img src="rtelyricfm.svg" alt="RTE Lyric FM">
            </button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    function openApp(uri){
      window.location.href = uri;
    }

    function openSpotify(){
      const fallbackUrl = 'https://open.spotify.com/';
      const intentUrl = 'intent://open.spotify.com/#Intent;scheme=https;package=com.spotify.music;end';

      try{
        const frame = document.createElement('iframe');
        frame.style.display = 'none';
        frame.src = 'spotify:';
        document.body.appendChild(frame);
        setTimeout(() => frame.remove(), 1200);
      } catch (e) {}

      setTimeout(() => {
        try{
          window.location.href = intentUrl;
        } catch (e) {
          window.open(fallbackUrl, '_blank');
        }
      }, 250);

      setTimeout(() => {
        if (document.visibilityState === 'visible') {
          window.open(fallbackUrl, '_blank');
        }
      }, 1200);
    }

    const audio = document.getElementById('radio');
    const nowTitle = document.getElementById('nowTitle');
    const nowStatus = document.getElementById('nowStatus');
    const liveBadge = document.getElementById('liveBadge');
    const stereoFace = document.getElementById('stereoFace');
    const frequencyReadout = document.getElementById('frequencyReadout');
    const stationsEl = document.querySelector('.stations');
    const stationButtons = document.querySelectorAll('.stations .station');

    const stationFrequencyMap = {
      "RTE 1": "88.5",
      "Sunshine 106.8": "106.8",
      "East Coast FM": "96.2",
      "2FM": "90.7",
      "Q102": "102.2",
      "RTE Lyric FM": "96.7"
    };

    function setActiveStation(name){
      stationButtons.forEach((button) => {
        button.classList.toggle('active-station', button.dataset.station === name);
      });
    }

    function scrollStations(direction){
      if (!stationsEl) return;

      const firstStation = stationsEl.querySelector('.station');
      const distance = firstStation ? firstStation.offsetWidth + 16 : 260;
      stationsEl.scrollBy({ left: direction * distance, behavior: 'smooth' });
    }

    if (stationsEl) {
      let touchedStation = null;
      let touchStartX = 0;
      let dragStartScroll = 0;
      let didDrag = false;
      let isDraggingStations = false;

      stationsEl.addEventListener('touchstart', (event) => {
        touchedStation = event.target.closest('.station');
        touchStartX = event.touches[0].clientX;
        dragStartScroll = stationsEl.scrollLeft;
        didDrag = false;
        isDraggingStations = true;
        stationsEl.classList.add('dragging');
        event.preventDefault();
      }, { passive: false });

      document.addEventListener('touchmove', (event) => {
        if (!isDraggingStations || event.touches.length === 0) return;

        const delta = event.touches[0].clientX - touchStartX;
        if (Math.abs(delta) > 6) {
          didDrag = true;
          event.preventDefault();
        }
        stationsEl.scrollLeft = dragStartScroll - delta;
      }, { passive: false });

      function stopStationDrag(event){
        if (!isDraggingStations) return;

        if (!didDrag && touchedStation) {
          play(touchedStation.dataset.station, touchedStation.dataset.url);
        }

        touchedStation = null;
        isDraggingStations = false;
        stationsEl.classList.remove('dragging');
        event.preventDefault();
      }

      document.addEventListener('touchend', stopStationDrag, { passive: false });
      document.addEventListener('touchcancel', stopStationDrag, { passive: false });

      stationsEl.addEventListener('click', (event) => {
        const station = event.target.closest('.station');
        if (!station) return;

        event.preventDefault();
        if (!didDrag) {
          play(station.dataset.station, station.dataset.url);
        }
      }, true);
    }

    function play(name, url){
      setActiveStation(name);
      stereoFace.classList.add('is-playing');
      nowTitle.textContent = name;
      nowStatus.textContent = 'Tuning...';
      liveBadge.textContent = 'Live';
      frequencyReadout.textContent = stationFrequencyMap[name] ?? '87.5';
      audio.src = url;

      audio.play()
        .then(() => {
          nowStatus.textContent = 'Broadcasting now';
        })
        .catch(() => {
          setActiveStation();
          stereoFace.classList.remove('is-playing');
          nowStatus.textContent = 'Signal unavailable';
          liveBadge.textContent = 'Error';
        });
    }

    function stopRadio(){
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
      setActiveStation();
      stereoFace.classList.remove('is-playing');
      nowTitle.textContent = 'Radio Off';
      nowStatus.textContent = 'Select a station to tune in';
      liveBadge.textContent = 'Standby';
      frequencyReadout.textContent = '87.5';
    }
  </script>
</body>
</html>
