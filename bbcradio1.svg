<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">BBC Radio 1</title>
  <desc id="desc">BBC Radio 1 station tile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff4f9a"/>
      <stop offset=".5" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ffd42a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="42" fill="url(#bg)"/>
  <rect x="58" y="66" width="396" height="94" rx="10" fill="#111"/>
  <g fill="#fff" font-family="Arial, Helvetica, sans-serif" font-weight="900">
    <text x="105" y="130" font-size="54">BBC</text>
    <text x="256" y="330" text-anchor="middle" font-size="176">1</text>
    <text x="256" y="405" text-anchor="middle" font-size="48">RADIO</text>
